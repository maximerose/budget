<!-- Arrière-plan sombre avec flou -->
<div class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4 transition-opacity">
    
    <!-- Carte Modale (Glisse du bas sur mobile) -->
    <div class="bg-slate-900 border border-slate-800 w-full sm:max-w-lg rounded-t-3xl sm:rounded-2xl p-6 shadow-2xl relative space-y-5">
        
        <!-- En-tête Modale -->
        <div class="flex items-center justify-between border-b border-slate-800 pb-3">
            <h3 class="text-lg font-bold text-slate-100 flex items-center gap-2">
                <span class="text-emerald-400">⚡</span> Saisie Rapide
            </h3>
            <button onclick="document.getElementById('modal-container').innerHTML = ''" 
                    class="text-slate-400 hover:text-slate-200 p-1 rounded-lg">
                ✕
            </button>
        </div>

        <!-- Formulaire HTMX -->
        <form hx-post="{% url 'quick_expense_form' %}" 
              hx-target="#modal-container"
              hx-swap="innerHTML"
              class="space-y-4">
            {% csrf_token %}

            <!-- Champ Montant (Focus direct) -->
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Montant (€)</label>
                <input type="number" step="0.01" name="total_amount" required autofocus
                       placeholder="0,00"
                       class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-2xl font-bold text-emerald-400 focus:outline-none focus:border-emerald-500">
            </div>

            <!-- Sélecteurs : Catégorie & Compte -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Catégorie</label>
                    <select name="category" required
                            class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-slate-100 focus:outline-none focus:border-emerald-500">
                        {% for cat in categories %}
                            <option value="{{ cat.id }}">{{ cat.name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Compte Débité</label>
                    <select name="bank_account" required
                            class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-slate-100 focus:outline-none focus:border-emerald-500">
                        {% for acc in accounts %}
                            <option value="{{ acc.id }}">{{ acc.name }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <!-- Champ Date (Par défaut aujourd'hui via timezone.localdate ou value dynamique) -->
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Date de la transaction</label>
                <input type="date" name="transaction_date" value="{{ today|date:'Y-m-d' }}" required
                       class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-slate-100 focus:outline-none focus:border-emerald-500">
            </div>

            <!-- Champ Libellé (Optionnel, déplacé en bas) -->
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Libellé / Commentaire (optionnel)</label>
                <input type="text" name="label" placeholder="Ex: Courses Leclerc, Matelas trek..."
                       class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-slate-100 focus:outline-none focus:border-emerald-500">
            </div>

            <!-- Boutons Actions -->
            <div class="flex items-center gap-3 pt-2">
                <button type="button" 
                        onclick="document.getElementById('modal-container').innerHTML = ''"
                        class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold py-3 rounded-xl transition-colors">
                    Annuler
                </button>
                <button type="submit" 
                        class="flex-1 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold py-3 rounded-xl shadow-lg shadow-emerald-500/20 transition-colors">
                    Valider
                </button>
            </div>
        </form>
    </div>
</div>

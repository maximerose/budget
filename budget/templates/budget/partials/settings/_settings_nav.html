<nav class="flex overflow-x-auto gap-6 border-b border-brand-border/60 mb-6 scrollbar-hide relative">
  <a href="{% url 'settings_accounts' %}"
     {% if active_tab == 'accounts' %}id="active-nav-tab"{% endif %}
     class="pb-3 px-1 text-sm font-semibold transition-colors whitespace-nowrap {% if active_tab == 'accounts' %}text-brand border-b-2 border-brand{% else %}text-slate-400 hover:text-slate-200{% endif %}">
    Comptes bancaires
  </a>

  <a href="{% url 'settings_categories' %}"
     {% if active_tab == 'categories' %}id="active-nav-tab"{% endif %}
     class="pb-3 px-1 text-sm font-semibold transition-colors whitespace-nowrap {% if active_tab == 'categories' %}text-brand border-b-2 border-brand{% else %}text-slate-400 hover:text-slate-200{% endif %}">
    Catégories
  </a>

  <a href="{% url 'settings_recurring' %}"
     {% if active_tab == 'recurring' %}id="active-nav-tab"{% endif %}
     class="pb-3 px-1 text-sm font-semibold transition-colors whitespace-nowrap {% if active_tab == 'recurring' %}text-brand border-b-2 border-brand{% else %}text-slate-400 hover:text-slate-200{% endif %}">
    Charges fixes
  </a>

  <a href="#"
     {% if active_tab == 'profile' %}id="active-nav-tab"{% endif %}
     class="pb-3 px-1 text-sm font-semibold transition-colors whitespace-nowrap text-slate-400 hover:text-slate-200">
    Foyer & Profil
  </a>
</nav>

<!-- Script pour centrer automatiquement l'onglet actif sur mobile -->
<script>
  (function() {
    const activeTab = document.getElementById('active-nav-tab');
    if (activeTab) {
      activeTab.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
    }
  })();
</script>

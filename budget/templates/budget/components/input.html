<div class="space-y-1">
    {% if label %}
        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider">{{ label }}</label>
    {% endif %}
    <input type="{{ type|default:'text' }}"
           name="{{ name }}"
           {% if value %}value="{{ value }}" {% endif %}
           {% if placeholder %}placeholder="{{ placeholder }}" {% endif %}
           {% if required %}required{% endif %}
           {% if autofocus %}autofocus{% endif %}
           {% if step %}step="{{ step }}" {% endif %}
           onfocus="this.select()"
           class="input-base px-4 py-2.5" />
    {% if help_text %}
        <p class="text-[11px] text-slate-500">{{ help_text }}</p>
    {% endif %}
</div>

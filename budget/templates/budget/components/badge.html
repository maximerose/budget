<span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-semibold border {% if variant == 'success' or variant == 'income' %} bg-budget-income/10 text-budget-income border-budget-income/20 {% elif variant == 'danger' or variant == 'expense' or variant == 'recurring' %} bg-budget-recurring/10 text-budget-recurring border-budget-recurring/20 {% elif variant == 'warning' or variant == 'variable' %} bg-budget-variable/10 text-budget-variable border-budget-variable/20 {% elif variant == 'savings' %} bg-budget-savings/10 text-budget-savings border-budget-savings/20 {% else %} bg-brand-border/50 text-slate-300 border-brand-border {% endif %}">
    {{ text }}
</span>

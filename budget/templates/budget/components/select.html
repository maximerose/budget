<div class="space-y-1">
    {% if label %}
        <label for="{{ name }}" class="block text-xs font-semibold text-slate-400 uppercase tracking-wider">{{ label }}</label>
    {% endif %}
    <select id="{{ name }}"
            name="{{ name }}"
            {% if required %}required{% endif %}
            class="input-base px-3 py-2.5">

        <!-- Si le champ n'est pas obligatoire ou si un placeholder est défini, on affiche l'option vide -->
        {% if not required or placeholder %}
            <option value="" {% if not selected %}selected{% endif %}>{{ placeholder|default:"Aucune sélection" }}</option>
        {% endif %}

        {% for item in options %}
            {% if item.name %}
                <!-- Cas 1 : Objet de base de données ou Dictionnaire (ex: item.id / item.name) -->
                <option value="{{ item.id }}" {% if item.id|slugify == selected|slugify %}selected{% endif %}>{{ item.name }}</option>
            {% else %}
                <!-- Cas 2 : Tuple Django Choices (ex: item.0 / item.1) -->
                <option value="{{ item.0 }}" {% if item.0|slugify == selected|slugify %}selected{% endif %}>{{ item.1 }}</option>
            {% endif %}
        {% endfor %}
    </select>

    {% if help_text %}
        <p class="text-[11px] text-slate-500">{{ help_text }}</p>
    {% endif %}
</div>

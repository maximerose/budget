<div class="space-y-1">
    {% if label %}
        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider">{{ label }}</label>
    {% endif %}
    <select name="{{ name }}" {% if required %}required{% endif %} class="input-base px-3 py-2.5">
        {% if placeholder %}
            <option value="" disabled selected>{{ placeholder }}</option>
        {% endif %}
        {% for item in options %}
            <option value="{{ item.id }}" {% if item.id|slugify==selected|slugify %}selected{% endif %}>{{ item.name }}</option>
        {% endfor %}
    </select>
    {% if help_text %}
        <p class="text-[11px] text-slate-500">{{ help_text }}</p>
    {% endif %}
</div>
